<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Martom savjetnik · pitanja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16181D;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F0; font-family: Inter, system-ui, sans-serif; color: #16181D; display: flex; flex-direction: column">
  <header style="background: #FFFFFF; border-top: 5px solid #E30613; border-bottom: 1px solid #E2E2DE; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between">
    <img src="../assets/martom-logo.png" alt="Željezarija Martom" style="height: 34px; width: auto; display: block">
    <a href="#" aria-label="Pozovi Martom" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #D5DAD3; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
    </a>
  </header>

  <main style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="align-self: flex-end; max-width: 80%; background: #16181D; color: #FFFFFF; padding: 12px 14px; border-radius: 16px 16px 4px 16px; font-size: 15px; line-height: 1.45">Treba mi 25 m ograde za dvorište, visina oko 1,5 m</div>

    <div style="display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 1px solid #E3E5E8; border-radius: 16px 16px 16px 4px; padding: 16px">
      <p style="margin: 0; font-size: 15px; line-height: 1.5">Odlično, za dvorište od 25 m imamo dobra rješenja. Još tri stvari da izaberem pravu ogradu:</p>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: #3E4450">Koja boja?</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" onClick="{{ pickColorA }}" style="{{ colorA }}">Antracit</button>
          <button type="button" onClick="{{ pickColorZ }}" style="{{ colorZ }}">Zelena</button>
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9CFC6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500; color: #16181D">Svejedno</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: #3E4450">Gdje idu stupovi?</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid #16181D; background: #16181D; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; color: #FFFFFF">U zemlju (betoniram)</button>
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9CFC6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500; color: #16181D">Na beton (s pločicom)</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: #3E4450">Treba li kapija?</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9CFC6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500; color: #16181D">Pješačka</button>
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9CFC6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500; color: #16181D">Kolna</button>
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid #16181D; background: #16181D; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; color: #FFFFFF">Ne treba</button>
        </div>
      </div>

      <a href="3-results.html" style="height: 48px; border-radius: 24px; background: #E30613; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px">Prikaži prijedlog
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </main>

  <footer style="background: #FFFFFF; border-top: 1px solid #E3E5E8; padding: 12px 16px 20px">
    <label for="msg" style="position: absolute; left: -9999px">Poruka</label>
    <div style="display: flex; gap: 8px; align-items: center">
      <input id="msg" placeholder="Ili napišite odgovor…" style="flex: 1; height: 48px; box-sizing: border-box; border: 1px solid #C9CFC6; border-radius: 24px; padding: 0 16px; font-family: Inter, sans-serif; font-size: 16px; color: #16181D">
      <button type="button" aria-label="Pošalji" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: #E30613; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { color: 'a' };
  }
  renderVals() {
    const on = 'min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid #16181D; background: #16181D; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; color: #FFFFFF';
    const off = 'min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9CFC6; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500; color: #16181D';
    return {
      colorA: this.state.color === 'a' ? on : off,
      colorZ: this.state.color === 'z' ? on : off,
      pickColorA: () => this.setState({ color: 'a' }),
      pickColorZ: () => this.setState({ color: 'z' })
    };
  }
}
</script>
</body>
</html>
