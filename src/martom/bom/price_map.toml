# Which synced product prices each BOM line (#125). Data, not code: every change is
# reviewed in a PR. Read by martom.bom.pricing (load_price_map); the DB pricer
# (martom.agent.pricer) and Toni's review check (bom_price_missing) use it.
#
# DRAFT: drafted by an agent from the local synced catalogue on 27 Nov 2026. Tomislav
# (and Toni where unsure) confirm it, then `status` becomes "reviewed".
status = "draft"

# One [[entry]] per BOM item + size, exactly as the calculators write them
# (martom.bom.common.Item values; sizes such as "153 × 250 cm", "155 cm", "M8×80").
# Leave `size` out for a line without a size.
#
# An entry points at either
#   listing_id + variants : an OLX listing and the product_variant row(s) that price the
#                           line. Each table in `variants` describes ONE variant:
#                             height_cm, length_cm  whole centimetres; the column must hold
#                                                   one size ("H-125", "H-125 cm", "125 cm")
#                             colour, size, unit    as written; case, accents and spaces
#                                                   ignored ("2,70MM" == "2,70 mm")
#                             label_contains        text the label must contain (never the
#                                                   whole label: it may hold the price)
#                           `unit` is required: what one BOM quantity is priced per.
#                           Each table must match exactly one variant of the listing;
#                           several tables (e.g. colours) must all match and all have the
#                           same price.
#   manual                : a table in manual_products.toml (products without a listing).
#
# Anything else is "cijena na upit": no entry, an inactive listing, a variant that is
# missing, ambiguous or has no price, or colours with different prices. Never a guess.
#
# [[unmapped]] records the BOM lines that deliberately have no entry yet, with the reason,
# so a test can check that every line the calculators emit is decided.

