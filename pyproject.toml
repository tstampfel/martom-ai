[project]
name = "martom"
version = "0.1.0"
description = "Agentic RAG advisor for Željezarija Martom: fence advice, materials lists and catalogue search."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tomislav Stampfel", email = "18047150+tstampfel@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "redis>=8.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
martom = "martom.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear, UP pyupgrade,
# SIM simplifications, N naming, RUF ruff-specific checks.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["martom"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
